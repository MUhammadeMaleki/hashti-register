[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an isolated real PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/api/auth.py" = ["B008"]
"app/api/dependencies.py" = ["B008"]
"app/api/management.py" = ["B008"]
"app/api/events.py" = ["B008"]
"app/api/public.py" = ["B008"]
"app/api/guests.py" = ["B008"]
"app/api/registrations.py" = ["B008"]
"app/api/finance.py" = ["B008"]
"app/api/attendance.py" = ["B008"]
"app/api/charges.py" = ["B008"]
"app/api/payments.py" = ["B008"]
"app/api/cancellations.py" = ["B008"]
"app/api/reports.py" = ["B008"]
"app/api/imports.py" = ["B008"]
